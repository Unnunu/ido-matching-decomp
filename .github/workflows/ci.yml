name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both versions and check progress
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu gcc-multilib

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache IDO recompiler
        uses: actions/cache@v4
        with:
          path: tools/ido_recomp
          key: ido-recomp-v1.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install objdiff-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            https://github.com/encounter/objdiff/releases/download/v3.8.3/objdiff-cli-linux-x86_64 \
            -o "$HOME/.local/bin/objdiff-cli"
          chmod +x "$HOME/.local/bin/objdiff-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/objdiff-cli" --version

      - name: Restore progress baseline
        uses: actions/cache/restore@v4
        with:
          path: build/baseline.json
          key: progress-baseline-${{ github.sha }}
          restore-keys: |
            progress-baseline-

      - name: Sync Python dependencies
        run: uv sync

      - name: Set up tools
        run: make setup

      - name: Disassemble both versions
        run: make disasm-all

      - name: Build both versions
        run: make -j "$(nproc)" both

      - name: Initialize baseline when missing
        run: |
          if [ ! -f build/baseline.json ]; then
            echo "No baseline cache available; initializing from current progress."
            make baseline
          fi

      - name: Check progress and baseline
        if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-progress')) }}
        run: make check

      - name: Note skipped progress check
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-progress') }}
        run: echo "::warning::Progress check skipped by the skip-progress label."

      - name: Refresh baseline on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: make baseline

      - name: Save progress baseline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: build/baseline.json
          key: progress-baseline-${{ github.sha }}

      - name: Upload progress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-${{ github.sha }}
          path: |
            build/report.json
            build/progress.json
            build/baseline.json
            PROGRESS.md
          if-no-files-found: warn
          retention-days: 14
